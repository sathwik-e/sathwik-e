<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Background Technical Grid Pattern -->
    <pattern id="mfd-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#171c26" stroke-width="0.75" stroke-opacity="0.8"/>
      <circle cx="24" cy="24" r="0.75" fill="#e10600" fill-opacity="0.25"/>
    </pattern>

    <!-- Radial Cockpit Glow (F1 Red & Speed Cyan) -->
    <radialGradient id="cockpit-glow" cx="50%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#e10600" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Border Gradient -->
    <linearGradient id="mfd-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e10600" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="mfd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    .mono {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
    }

    /* Shift Light Sequential Cascade (Authentic F1 LED Pattern) */
    @keyframes rev-1 {
      0%, 15% { fill: #1e293b; opacity: 0.3; }
      20%, 85% { fill: #22c55e; opacity: 1; filter: drop-shadow(0 0 3px #22c55e); }
      90%, 100% { fill: #38bdf8; opacity: 1; }
    }
    @keyframes rev-2 {
      0%, 35% { fill: #1e293b; opacity: 0.3; }
      40%, 85% { fill: #eab308; opacity: 1; filter: drop-shadow(0 0 3px #eab308); }
      90%, 100% { fill: #38bdf8; opacity: 1; }
    }
    @keyframes rev-3 {
      0%, 55% { fill: #1e293b; opacity: 0.3; }
      60%, 85% { fill: #e10600; opacity: 1; filter: drop-shadow(0 0 4px #e10600); }
      90%, 100% { fill: #38bdf8; opacity: 1; }
    }
    @keyframes rev-4 {
      0%, 75% { fill: #1e293b; opacity: 0.3; }
      80%, 100% { fill: #38bdf8; opacity: 1; filter: drop-shadow(0 0 5px #38bdf8); }
    }

    .l-1 { animation: rev-1 2.2s infinite ease-in-out; }
    .l-2 { animation: rev-2 2.2s infinite ease-in-out; }
    .l-3 { animation: rev-3 2.2s infinite ease-in-out; }
    .l-4 { animation: rev-4 2.2s infinite ease-in-out; }

    /* Red Beacon Pulse */
    @keyframes beacon-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-dot {
      animation: beacon-pulse 1.6s infinite ease-in-out;
    }
    ]]>
  </style>

  <!-- Base Panel Shell -->
  <rect x="2" y="2" width="896" height="246" rx="10" fill="#080a0f" stroke="url(#mfd-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="246" rx="10" fill="url(#mfd-grid)"/>
  <rect x="2" y="2" width="896" height="246" rx="10" fill="url(#cockpit-glow)"/>

  <!-- Racing Cockpit Corner Brackets -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#e10600" stroke-width="2"/>
  <path d="M 886 30 L 886 14 L 870 14" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 14 220 L 14 236 L 30 236" fill="none" stroke="#e10600" stroke-width="2"/>
  <path d="M 886 220 L 886 236 L 870 236" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Top MFD Header Bar -->
  <g class="mono" transform="translate(30, 20)">
    <!-- Red Beacon -->
    <circle cx="6" cy="6" r="4" fill="#e10600" class="pulse-dot" filter="url(#mfd-glow)"/>
    <text x="18" y="10" font-size="10" font-weight="700" fill="#f8fafc" letter-spacing="1.5">MOTEC M800 // ECU BOOT SEQUENCER</text>

    <!-- F1 Shift Light Array (16 LEDs across center) -->
    <g transform="translate(260, 0)">
      <!-- Green LEDs (4) -->
      <rect x="0"  y="0" width="13" height="7" rx="1.5" class="l-1" fill="#22c55e"/>
      <rect x="16" y="0" width="13" height="7" rx="1.5" class="l-1" fill="#22c55e"/>
      <rect x="32" y="0" width="13" height="7" rx="1.5" class="l-1" fill="#22c55e"/>
      <rect x="48" y="0" width="13" height="7" rx="1.5" class="l-1" fill="#22c55e"/>
      <!-- Amber LEDs (4) -->
      <rect x="68"  y="0" width="13" height="7" rx="1.5" class="l-2" fill="#eab308"/>
      <rect x="84"  y="0" width="13" height="7" rx="1.5" class="l-2" fill="#eab308"/>
      <rect x="100" y="0" width="13" height="7" rx="1.5" class="l-2" fill="#eab308"/>
      <rect x="116" y="0" width="13" height="7" rx="1.5" class="l-2" fill="#eab308"/>
      <!-- F1 Red LEDs (4) -->
      <rect x="136" y="0" width="13" height="7" rx="1.5" class="l-3" fill="#e10600"/>
      <rect x="152" y="0" width="13" height="7" rx="1.5" class="l-3" fill="#e10600"/>
      <rect x="168" y="0" width="13" height="7" rx="1.5" class="l-3" fill="#e10600"/>
      <rect x="184" y="0" width="13" height="7" rx="1.5" class="l-3" fill="#e10600"/>
      <!-- Blue Shift LEDs (4) -->
      <rect x="204" y="0" width="13" height="7" rx="1.5" class="l-4" fill="#38bdf8"/>
      <rect x="220" y="0" width="13" height="7" rx="1.5" class="l-4" fill="#38bdf8"/>
      <rect x="236" y="0" width="13" height="7" rx="1.5" class="l-4" fill="#38bdf8"/>
      <rect x="252" y="0" width="13" height="7" rx="1.5" class="l-4" fill="#38bdf8"/>
    </g>

    <!-- Right Live Status Pill -->
    <g transform="translate(680, -2)">
      <rect x="0" y="0" width="158" height="18" rx="3" fill="#13090b" stroke="#7f1d1d" stroke-width="0.8"/>
      <circle cx="10" cy="9" r="3" fill="#e10600"/>
      <text x="20" y="12" font-size="8.5" font-weight="700" fill="#f87171" letter-spacing="1">LIVE TELEMETRY FEED</text>
    </g>
  </g>

  <!-- Divider Line Below Shift Lights -->
  <line x1="30" y1="42" x2="870" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= MAIN CENTER READOUT ================= -->
  <!-- Target Tag (F1 Red / Racing Accent) -->
  <text x="32" y="68" class="mono" font-size="11.5" font-weight="700" fill="#e10600" letter-spacing="2">
    &gt; MOTORSPORT &amp; TELEMETRY SOFTWARE ENGINEER
  </text>

  <!-- Big Name Readout -->
  <g class="mono">
    <text x="30" y="116" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      SATHWIK ELAPROLU
    </text>
    <!-- Right Badge Accent -->
    <g transform="translate(695, 84)">
      <rect x="0" y="0" width="145" height="34" rx="4" fill="#140a0b" stroke="#991b1b" stroke-width="1"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#f87171" letter-spacing="1">PITWALL TELEMETRY</text>
      <text x="12" y="27" font-size="8" fill="#cbd5e1" letter-spacing="0.5">FORZA · F1 · ML ENGINES</text>
    </g>
  </g>

  <!-- Subtitle Line -->
  <text x="32" y="138" class="mono" font-size="12" fill="#94a3b8" letter-spacing="0.8">
    Building low-latency telemetry pipelines, 60Hz UDP parsers, and machine learning models for vehicle dynamics.
  </text>

  <!-- ================= BOTTOM 3 MFD GAUGES ================= -->
  <g class="mono" transform="translate(30, 156)">
    <!-- Container -->
    <rect x="0" y="0" width="840" height="66" rx="6" fill="#0b0e14" stroke="#1e293b" stroke-width="1"/>

    <!-- Pod 1: Ingest Speed (F1 Red) -->
    <g transform="translate(24, 8)">
      <text x="0" y="28" font-size="28" font-weight="900" fill="#e10600" filter="url(#mfd-glow)">60Hz</text>
      <text x="82" y="20" font-size="10" font-weight="800" fill="#f8fafc" letter-spacing="1">RAW UDP INGEST</text>
      <text x="82" y="32" font-size="8.5" fill="#64748b">16.6ms HARD REAL-TIME WINDOW</text>
      <text x="82" y="44" font-size="8" fill="#f87171">&gt; ZERO-COPY BINARY STRUCT UNPACK</text>
    </g>

    <!-- Divider 1 -->
    <line x1="305" y1="10" x2="305" y2="56" stroke="#1e293b" stroke-width="1"/>

    <!-- Pod 2: Voice Loop Latency (Electric Cyan) -->
    <g transform="translate(325, 8)">
      <text x="0" y="28" font-size="28" font-weight="900" fill="#38bdf8">&lt;150ms</text>
      <text x="110" y="20" font-size="10" font-weight="800" fill="#f8fafc" letter-spacing="1">AI PIT CREW DISPATCH</text>
      <text x="110" y="32" font-size="8.5" fill="#64748b">GROQ LLM + STREAMING AUDIO</text>
      <text x="110" y="44" font-size="8" fill="#38bdf8">&gt; CONVERSATIONAL TACTICAL CALLOUTS</text>
    </g>

    <!-- Divider 2 -->
    <line x1="605" y1="10" x2="605" y2="56" stroke="#1e293b" stroke-width="1"/>

    <!-- Pod 3: ML Degradation (Fastest Sector Purple) -->
    <g transform="translate(625, 8)">
      <text x="0" y="28" font-size="28" font-weight="900" fill="#c084fc">APEX</text>
      <text x="85" y="20" font-size="10" font-weight="800" fill="#f8fafc" letter-spacing="1">F1 TIRE ML REGRESSOR</text>
      <text x="85" y="32" font-size="8.5" fill="#64748b">FASTF1 API + RANDOM FOREST</text>
      <text x="85" y="44" font-size="7.5" fill="#c084fc">&gt; NON-LINEAR WEAR CLIFF MODEL</text>
    </g>
  </g>
</svg>
