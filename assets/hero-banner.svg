<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Technical Grid (Straight Cartesian Orthogonal Lines) -->
    <pattern id="clean-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="0.8"/>
    </pattern>

    <!-- White Grid Pattern for Wave Masking -->
    <pattern id="clean-grid-mask" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    </pattern>

    <mask id="grid-line-mask">
      <rect x="0" y="0" width="900" height="240" fill="url(#clean-grid-mask)"/>
    </mask>

    <!-- Wave 1: Rolling Diagonal Emerald Wave Gradient -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52e3a1" stop-opacity="0"/>
      <stop offset="35%" stop-color="#52e3a1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#52e3a1" stop-opacity="0.65"/>
      <stop offset="54%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#52e3a1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#52e3a1" stop-opacity="0"/>
    </linearGradient>

    <!-- Wave 2: Harmonic Secondary Wave Gradient -->
    <linearGradient id="wave-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="38%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="62%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="subtle-glow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#52e3a1" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Crisp Card Border -->
    <linearGradient id="border-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    /* Shift Light Cascade */
    @keyframes led-seq-1 { 0%, 20% { fill: #21262d; } 25%, 85% { fill: #10b981; } 90%, 100% { fill: #38bdf8; } }
    @keyframes led-seq-2 { 0%, 40% { fill: #21262d; } 45%, 85% { fill: #f59e0b; } 90%, 100% { fill: #38bdf8; } }
    @keyframes led-seq-3 { 0%, 60% { fill: #21262d; } 65%, 85% { fill: #ef4444; } 90%, 100% { fill: #38bdf8; } }
    @keyframes led-seq-4 { 0%, 80% { fill: #21262d; } 85%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 4px #38bdf8); } }

    .led-1 { animation: led-seq-1 2.2s infinite ease-in-out; }
    .led-2 { animation: led-seq-2 2.2s infinite ease-in-out; }
    .led-3 { animation: led-seq-3 2.2s infinite ease-in-out; }
    .led-4 { animation: led-seq-4 2.2s infinite ease-in-out; }

    /* Wave Animation across Straight Grid */
    @keyframes wave-travel-1 {
      0% { transform: translate(-900px, -240px); }
      100% { transform: translate(900px, 240px); }
    }
    @keyframes wave-travel-2 {
      0% { transform: translate(900px, -240px); }
      100% { transform: translate(-900px, 240px); }
    }

    .wave-sweep-1 {
      animation: wave-travel-1 6s infinite linear;
    }
    .wave-sweep-2 {
      animation: wave-travel-2 8.5s infinite linear;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.95); }
    }
    .pulse { animation: live-pulse 2s infinite ease-in-out; transform-origin: 40px 30px; }
    ]]>
  </style>

  <!-- Card Shell -->
  <rect x="2" y="2" width="896" height="236" rx="10" fill="#0a0b0e" stroke="url(#border-stroke)" stroke-width="1.5"/>

  <!-- Straight Background Grid (Fixed Cartesian geometry) -->
  <rect x="2" y="2" width="896" height="236" rx="10" fill="url(#clean-grid)"/>

  <!-- Wave Animation Across the Straight Grid (Masked to straight lines) -->
  <g mask="url(#grid-line-mask)">
    <g class="wave-sweep-1">
      <rect x="-450" y="-120" width="1800" height="480" fill="url(#wave-grad-1)"/>
    </g>
    <g class="wave-sweep-2">
      <rect x="-450" y="-120" width="1800" height="480" fill="url(#wave-grad-2)"/>
    </g>
  </g>

  <!-- Subtle Ambient Glow -->
  <rect x="2" y="2" width="896" height="236" rx="10" fill="url(#subtle-glow)"/>

  <!-- Top Metadata Bar -->
  <g class="font-mono">
    <!-- Live Green Signal Beacon -->
    <circle cx="40" cy="30" r="4" fill="#52e3a1" class="pulse"/>
    <text x="52" y="34" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">S. ELAPROLU // SYSTEMS &amp; AI ENGINEER</text>

    <!-- F1 Shift Lights (Centered) -->
    <g transform="translate(420, 24)">
      <!-- Green (3) -->
      <rect x="0"  y="0" width="10" height="10" rx="2" class="led-1" fill="#52e3a1"/>
      <rect x="14" y="0" width="10" height="10" rx="2" class="led-1" fill="#52e3a1"/>
      <rect x="28" y="0" width="10" height="10" rx="2" class="led-1" fill="#52e3a1"/>
      <!-- Amber (3) -->
      <rect x="44" y="0" width="10" height="10" rx="2" class="led-2" fill="#f59e0b"/>
      <rect x="58" y="0" width="10" height="10" rx="2" class="led-2" fill="#f59e0b"/>
      <rect x="72" y="0" width="10" height="10" rx="2" class="led-2" fill="#f59e0b"/>
      <!-- Red (3) -->
      <rect x="88"  y="0" width="10" height="10" rx="2" class="led-3" fill="#ef4444"/>
      <rect x="102" y="0" width="10" height="10" rx="2" class="led-3" fill="#ef4444"/>
      <rect x="116" y="0" width="10" height="10" rx="2" class="led-3" fill="#ef4444"/>
      <!-- Blue (3) -->
      <rect x="132" y="0" width="10" height="10" rx="2" class="led-4" fill="#38bdf8"/>
      <rect x="146" y="0" width="10" height="10" rx="2" class="led-4" fill="#38bdf8"/>
      <rect x="160" y="0" width="10" height="10" rx="2" class="led-4" fill="#38bdf8"/>
    </g>

    <!-- Location & Status Badge -->
    <g transform="translate(680, 20)">
      <rect x="0" y="0" width="180" height="22" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#52e3a1"/>
      <text x="22" y="15" font-size="10" font-weight="600" fill="#f0f6fc">HYDERABAD, IN · 2026</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="36" y1="52" x2="864" y2="52" stroke="#21262d" stroke-width="1"/>

  <!-- Main Hero Content -->
  <!-- Name (Large, Ultra-Readable) -->
  <text x="38" y="98" class="font-sans" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Sathwik Elaprolu
  </text>

  <!-- Engineering Tagline (Matching Portfolio Signal Green) -->
  <text x="40" y="124" class="font-mono" font-size="13" font-weight="500" fill="#52e3a1" letter-spacing="0.5">
    GenAI Applications · Motorsport Telemetry · Self-Healing Data Pipelines
  </text>

  <text x="40" y="145" class="font-sans" font-size="13" fill="#8b949e">
    Engineering low-latency telemetry pipelines, 60Hz raw binary packet parsers, and machine learning models end to end.
  </text>

  <!-- 4 Performance Pillars directly from Portfolio -->
  <g class="font-mono" transform="translate(36, 168)">
    <!-- Pod 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="52" rx="6" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <text x="14" y="24" font-size="15" font-weight="800" fill="#52e3a1">05 BUILT</text>
      <text x="14" y="41" font-size="10" fill="#8b949e">Production Systems</text>
    </g>

    <!-- Pod 2 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="195" height="52" rx="6" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <text x="14" y="24" font-size="15" font-weight="800" fill="#52e3a1">60Hz UDP</text>
      <text x="14" y="41" font-size="10" fill="#8b949e">Raw Ingest Rate</text>
    </g>

    <!-- Pod 3 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="195" height="52" rx="6" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <text x="14" y="24" font-size="15" font-weight="800" fill="#38bdf8">&lt;150ms</text>
      <text x="14" y="41" font-size="10" fill="#8b949e">Voice AI Crew Chief Loop</text>
    </g>

    <!-- Pod 4 -->
    <g transform="translate(630, 0)">
      <rect x="0" y="0" width="198" height="52" rx="6" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <text x="14" y="24" font-size="15" font-weight="800" fill="#f59e0b">100%</text>
      <text x="14" y="41" font-size="10" fill="#8b949e">Local-First SQLite &amp; Zero Leak</text>
    </g>
  </g>
</svg>
