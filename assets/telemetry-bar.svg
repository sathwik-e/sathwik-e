<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-bar {
      0%, 100% { height: 8px; y: 28px; }
      50% { height: 26px; y: 19px; }
    }
    @keyframes pulse-bar-2 {
      0%, 100% { height: 22px; y: 21px; }
      50% { height: 10px; y: 27px; }
    }
    @keyframes pulse-bar-3 {
      0%, 100% { height: 14px; y: 25px; }
      50% { height: 32px; y: 16px; }
    }
    .bar-a { animation: pulse-bar 1.2s ease-in-out infinite; }
    .bar-b { animation: pulse-bar-2 1.6s ease-in-out infinite; }
    .bar-c { animation: pulse-bar-3 1.4s ease-in-out infinite; }
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="60" rx="8" fill="#080a0f" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left: Socket status -->
  <g class="mono" transform="translate(24, 0)">
    <circle cx="10" cy="32" r="4" fill="#22c55e"/>
    <text x="24" y="27" font-size="10" font-weight="700" fill="#4ade80" letter-spacing="1">TELEMETRY FEED // PORT 20777</text>
    <text x="24" y="44" font-size="9.5" fill="#64748b">MODE: RAW UDP DGRAM · NO SYNTHETIC JITTER</text>
  </g>

  <!-- Center: Animated equalizer / audio wave bars -->
  <g fill="#22c55e" transform="translate(365, 0)">
    <rect x="0" y="26" width="3" height="12" rx="1.5" class="bar-a" fill="#22c55e"/>
    <rect x="7" y="22" width="3" height="20" rx="1.5" class="bar-b" fill="#4ade80"/>
    <rect x="14" y="20" width="3" height="24" rx="1.5" class="bar-c" fill="#38bdf8"/>
    <rect x="21" y="25" width="3" height="14" rx="1.5" class="bar-a" fill="#22c55e"/>
    <rect x="28" y="21" width="3" height="22" rx="1.5" class="bar-b" fill="#4ade80"/>
    <rect x="35" y="18" width="3" height="28" rx="1.5" class="bar-c" fill="#38bdf8"/>
    <rect x="42" y="24" width="3" height="16" rx="1.5" class="bar-a" fill="#22c55e"/>
    <rect x="49" y="20" width="3" height="24" rx="1.5" class="bar-b" fill="#4ade80"/>
    <rect x="56" y="27" width="3" height="10" rx="1.5" class="bar-c" fill="#22c55e"/>
    <rect x="63" y="22" width="3" height="20" rx="1.5" class="bar-a" fill="#38bdf8"/>
    <rect x="70" y="25" width="3" height="14" rx="1.5" class="bar-b" fill="#4ade80"/>
    <rect x="77" y="19" width="3" height="26" rx="1.5" class="bar-c" fill="#22c55e"/>
  </g>

  <!-- Right: Real-time telemetry specs -->
  <g class="mono" transform="translate(485, 0)">
    <text x="0" y="27" font-size="9.5" fill="#94a3b8">INGEST: <tspan fill="#f8fafc" font-weight="700">60.0 Hz</tspan></text>
    <text x="0" y="44" font-size="9.5" fill="#94a3b8">PAYLOAD: <tspan fill="#4ade80" font-weight="700">324B / PKT</tspan></text>

    <text x="135" y="27" font-size="9.5" fill="#94a3b8">LATENCY: <tspan fill="#38bdf8" font-weight="700">&lt;0.08ms</tspan></text>
    <text x="135" y="44" font-size="9.5" fill="#94a3b8">DROP_RATE: <tspan fill="#a7f3d0" font-weight="700">0.00%</tspan></text>

    <text x="270" y="35" font-size="10.5" font-weight="800" fill="#22c55e" letter-spacing="1">LIVE STREAM ■</text>
  </g>
</svg>
