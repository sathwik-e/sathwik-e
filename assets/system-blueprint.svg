<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#151d28" stroke-width="0.75"/>
    </pattern>

    <linearGradient id="bp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="bp-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-green {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
    }
    .flow-line {
      stroke-dasharray: 4 4;
      animation: flow 1.5s linear infinite;
    }
    .live-dot {
      animation: pulse-green 1.8s infinite;
    }
  </style>

  <!-- Window Frame -->
  <rect x="2" y="2" width="896" height="406" rx="10" fill="#080a0f" stroke="url(#bp-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="406" rx="10" fill="url(#bp-grid)"/>

  <!-- Window Header Bar -->
  <g class="mono">
    <!-- Window controls -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8"/>

    <!-- Header title -->
    <text x="76" y="26" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="1.5">&lt;/&gt; SYSTEM BLUEPRINT &amp; CODE ARCHITECTURE</text>

    <!-- Right badge -->
    <g transform="translate(730, 11)">
      <rect x="0" y="0" width="140" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="14" y="15" font-size="9" font-weight="700" fill="#a7f3d0" letter-spacing="1">VERIFIED ARCHITECTURE</text>
    </g>
  </g>

  <line x1="2" y1="42" x2="898" y2="42" stroke="#1e293b" stroke-width="1"/>

  <!-- System Tabs Bar -->
  <g class="mono" transform="translate(24, 52)">
    <!-- Active Tab: Pitwall -->
    <rect x="0" y="0" width="195" height="30" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <circle cx="14" cy="15" r="3.5" fill="#22c55e" class="live-dot"/>
    <text x="24" y="19" font-size="10.5" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">01 PITWALL (60Hz UDP)</text>
    <rect x="0" y="28" width="195" height="2" fill="#4ade80" filter="url(#bp-glow)"/>

    <!-- Inactive Tab 2: Apex AI -->
    <rect x="205" y="0" width="195" height="30" rx="4" fill="#0a0f16" stroke="#1e293b" stroke-width="1"/>
    <text x="225" y="19" font-size="10.5" fill="#64748b" letter-spacing="0.5">02 APEX AI (ML FOREST)</text>

    <!-- Inactive Tab 3: MedAssist -->
    <rect x="410" y="0" width="195" height="30" rx="4" fill="#0a0f16" stroke="#1e293b" stroke-width="1"/>
    <text x="430" y="19" font-size="10.5" fill="#64748b" letter-spacing="0.5">03 MEDASSIST (LOCAL OCR)</text>

    <!-- Inactive Tab 4: Watchdog -->
    <rect x="615" y="0" width="235" height="30" rx="4" fill="#0a0f16" stroke="#1e293b" stroke-width="1"/>
    <text x="635" y="19" font-size="10.5" fill="#64748b" letter-spacing="0.5">04 WATCHDOG (SELF-HEAL)</text>
  </g>

  <!-- DATA PIPELINE FLOW HEADER -->
  <text x="26" y="105" class="mono" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.5">DATA PIPELINE FLOW (ZERO SYNTHETIC LATENCY):</text>

  <!-- Pipeline Flow 4 Nodes -->
  <g class="mono" transform="translate(24, 116)">
    <!-- Node 1: Ingest -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="186" height="52" rx="6" fill="#0d141e" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1">INPUT LAYER</text>
      <text x="12" y="34" font-size="11" font-weight="700" fill="#f8fafc">Forza Raw UDP 60Hz</text>
      <text x="12" y="46" font-size="8.5" fill="#4ade80">Port 20777 · 324B/pkt</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <line x1="188" y1="26" x2="218" y2="26" stroke="#22c55e" stroke-width="2" class="flow-line"/>
    <polygon points="220,26 214,22 214,30" fill="#22c55e"/>

    <!-- Node 2: Deserializer -->
    <g transform="translate(222, 0)">
      <rect x="0" y="0" width="186" height="52" rx="6" fill="#0d141e" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1">DESERIALIZE</text>
      <text x="12" y="34" font-size="11" font-weight="700" fill="#f8fafc">struct.unpack()</text>
      <text x="12" y="46" font-size="8.5" fill="#38bdf8">&lt;0.08ms · Zero-Copy</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <line x1="410" y1="26" x2="440" y2="26" stroke="#22c55e" stroke-width="2" class="flow-line"/>
    <polygon points="442,26 436,22 436,30" fill="#22c55e"/>

    <!-- Node 3: Ring Buffer -->
    <g transform="translate(444, 0)">
      <rect x="0" y="0" width="186" height="52" rx="6" fill="#0d141e" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1">BUFFER &amp; DECIDE</text>
      <text x="12" y="34" font-size="11" font-weight="700" fill="#f8fafc">In-Memory Ring Buffer</text>
      <text x="12" y="46" font-size="8.5" fill="#a7f3d0">Drop Stale Frames</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <line x1="632" y1="26" x2="662" y2="26" stroke="#22c55e" stroke-width="2" class="flow-line"/>
    <polygon points="664,26 658,22 658,30" fill="#22c55e"/>

    <!-- Node 4: Output & Voice AI -->
    <g transform="translate(666, 0)">
      <rect x="0" y="0" width="184" height="52" rx="6" fill="#0d141e" stroke="#1b4d2e" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#4ade80" letter-spacing="1">OUTPUT &amp; VOICE AI</text>
      <text x="12" y="34" font-size="11" font-weight="700" fill="#f8fafc">Groq LLM + WebSockets</text>
      <text x="12" y="46" font-size="8.5" fill="#4ade80">&lt;150ms Speech Loop</text>
    </g>
  </g>

  <!-- CODE IMPLEMENTATION TERMINAL -->
  <g class="mono" transform="translate(24, 184)">
    <rect x="0" y="0" width="850" height="155" rx="6" fill="#05070a" stroke="#1e293b" stroke-width="1"/>

    <!-- Terminal Subhead -->
    <text x="16" y="20" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1">CORE IMPLEMENTATION // low_latency_udp_worker.py</text>
    <line x1="1" y1="28" x2="849" y2="28" stroke="#111827" stroke-width="1"/>

    <!-- Code Lines -->
    <text x="16" y="48" font-size="11.5" fill="#475569">01  <tspan fill="#64748b"># Receive 60Hz UDP packets directly; drop queued stale telemetry on congestion</tspan></text>
    <text x="16" y="66" font-size="11.5" fill="#475569">02  <tspan fill="#38bdf8">sock</tspan> = <tspan fill="#f1f5f9">socket.socket(socket.AF_INET, socket.SOCK_DGRAM)</tspan></text>
    <text x="16" y="84" font-size="11.5" fill="#475569">03  <tspan fill="#38bdf8">sock.bind</tspan>((<tspan fill="#a7f3d0">"0.0.0.0"</tspan>, <tspan fill="#fbbf24">20777</tspan>))  <tspan fill="#64748b"># Dedicated sim port</tspan></text>
    <text x="16" y="102" font-size="11.5" fill="#475569">04  <tspan fill="#c084fc">while</tspan> <tspan fill="#38bdf8">True</tspan>:</text>
    <text x="16" y="120" font-size="11.5" fill="#475569">05      <tspan fill="#f1f5f9">data, _ = sock.recvfrom(</tspan><tspan fill="#fbbf24">324</tspan><tspan fill="#f1f5f9">)</tspan>  <tspan fill="#64748b"># Zero-copy binary unpack</tspan></text>
    <text x="16" y="136" font-size="11.5" fill="#475569">06      <tspan fill="#f1f5f9">telemetry = struct.unpack(</tspan><tspan fill="#a7f3d0">'&lt;iIffffffff...'</tspan><tspan fill="#f1f5f9">, data[:36])</tspan></text>
    <text x="16" y="150" font-size="11.5" fill="#475569">07      <tspan fill="#22c55e">await hud_stream.broadcast</tspan>(telemetry, <tspan fill="#fbbf24">sample_rate_hz=60</tspan>)</text>
  </g>

  <!-- Live Status Bar -->
  <g class="mono" transform="translate(24, 355)">
    <rect x="0" y="0" width="850" height="38" rx="4" fill="#0d141e" stroke="#1b4d2e" stroke-width="1"/>
    <circle cx="16" cy="19" r="4" fill="#22c55e" class="live-dot"/>
    <text x="28" y="23" font-size="10" font-weight="700" fill="#4ade80" letter-spacing="1">TELEMETRY BENCHMARK:</text>
    <text x="195" y="23" font-size="10" fill="#94a3b8">FRAME_TIME: <tspan fill="#f8fafc" font-weight="700">16.6ms</tspan></text>
    <text x="355" y="23" font-size="10" fill="#94a3b8">PACKET_LOSS: <tspan fill="#4ade80" font-weight="700">0.00%</tspan></text>
    <text x="515" y="23" font-size="10" fill="#94a3b8">AI_CALLOUT_LATENCY: <tspan fill="#38bdf8" font-weight="700">&lt;142ms</tspan></text>
    <text x="735" y="23" font-size="10" fill="#22c55e" font-weight="700">STATUS: NOMINAL ■</text>
  </g>
</svg>
