<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Background Technical Grid -->
    <pattern id="hud-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#141923" stroke-width="0.7"/>
    </pattern>

    <!-- Linear Border -->
    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#1e2329"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>

    <!-- Tachometer Fill Gradient -->
    <linearGradient id="tacho-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    }

    /* Shift Lights Animation Sequence */
    @keyframes s-light-1 { 0%, 15% { fill: #21262d; } 20%, 85% { fill: #10b981; } 90%, 100% { fill: #38bdf8; } }
    @keyframes s-light-2 { 0%, 35% { fill: #21262d; } 40%, 85% { fill: #f59e0b; } 90%, 100% { fill: #38bdf8; } }
    @keyframes s-light-3 { 0%, 55% { fill: #21262d; } 60%, 85% { fill: #ef4444; } 90%, 100% { fill: #38bdf8; } }
    @keyframes s-light-4 { 0%, 75% { fill: #21262d; } 80%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 4px #38bdf8); } }

    .sl-1 { animation: s-light-1 2.2s infinite ease-in-out; }
    .sl-2 { animation: s-light-2 2.2s infinite ease-in-out; }
    .sl-3 { animation: s-light-3 2.2s infinite ease-in-out; }
    .sl-4 { animation: s-light-4 2.2s infinite ease-in-out; }

    /* Throttle & Brake Pedals */
    @keyframes thr-anim {
      0% { height: 18px; y: 72px; }
      40% { height: 75px; y: 15px; }
      65% { height: 82px; y: 8px; }
      80% { height: 12px; y: 78px; }
      100% { height: 18px; y: 72px; }
    }
    @keyframes brk-anim {
      0% { height: 8px; y: 82px; }
      40% { height: 0px; y: 90px; }
      75% { height: 75px; y: 15px; }
      90% { height: 35px; y: 55px; }
      100% { height: 8px; y: 82px; }
    }
    .pedal-t { animation: thr-anim 3.2s infinite ease-in-out; }
    .pedal-b { animation: brk-anim 3.2s infinite ease-in-out; }

    /* Friction Circle G-Cursor */
    @keyframes g-cursor {
      0% { cx: 40px; cy: 40px; }
      25% { cx: 56px; cy: 28px; }
      50% { cx: 40px; cy: 60px; }
      75% { cx: 24px; cy: 34px; }
      100% { cx: 40px; cy: 40px; }
    }
    .g-dot { animation: g-cursor 3.2s infinite ease-in-out; }

    /* Radio Pulse */
    @keyframes r-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-pulse { animation: r-pulse 1.4s infinite; }
    ]]>
  </style>

  <!-- Panel Base -->
  <rect x="2" y="2" width="896" height="296" rx="10" fill="#0a0b0e" stroke="url(#hud-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="296" rx="10" fill="url(#hud-grid)"/>

  <!-- Top Status Bar -->
  <g class="font-mono">
    <!-- Red Live Beacon -->
    <circle cx="28" cy="22" r="4.5" fill="#ef4444" class="live-pulse"/>
    <text x="42" y="26" font-size="11.5" font-weight="700" fill="#f0f6fc" letter-spacing="1">MOTEC M800 // PITWALL SIMULATION TELEMETRY ENGINE</text>

    <!-- Source Port -->
    <text x="510" y="26" font-size="10.5" fill="#8b949e">SOURCE: FORZA UDP [PORT 20777]</text>

    <!-- Rate Pill -->
    <g transform="translate(745, 12)">
      <rect x="0" y="0" width="125" height="20" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <text x="12" y="14" font-size="9.5" font-weight="700" fill="#10b981" letter-spacing="1">60Hz REAL-TIME</text>
    </g>
  </g>

  <!-- Top Divider -->
  <line x1="24" y1="40" x2="876" y2="40" stroke="#21262d" stroke-width="1"/>

  <!-- Shift Lights Bar (Top Center) -->
  <g transform="translate(300, 48)">
    <!-- 16 Bold LEDs -->
    <rect x="0"   y="0" width="16" height="7" rx="1.5" class="sl-1" fill="#10b981"/>
    <rect x="20"  y="0" width="16" height="7" rx="1.5" class="sl-1" fill="#10b981"/>
    <rect x="40"  y="0" width="16" height="7" rx="1.5" class="sl-1" fill="#10b981"/>
    <rect x="60"  y="0" width="16" height="7" rx="1.5" class="sl-1" fill="#10b981"/>
    <rect x="84"  y="0" width="16" height="7" rx="1.5" class="sl-2" fill="#f59e0b"/>
    <rect x="104" y="0" width="16" height="7" rx="1.5" class="sl-2" fill="#f59e0b"/>
    <rect x="124" y="0" width="16" height="7" rx="1.5" class="sl-2" fill="#f59e0b"/>
    <rect x="144" y="0" width="16" height="7" rx="1.5" class="sl-2" fill="#f59e0b"/>
    <rect x="168" y="0" width="16" height="7" rx="1.5" class="sl-3" fill="#ef4444"/>
    <rect x="188" y="0" width="16" height="7" rx="1.5" class="sl-3" fill="#ef4444"/>
    <rect x="208" y="0" width="16" height="7" rx="1.5" class="sl-3" fill="#ef4444"/>
    <rect x="228" y="0" width="16" height="7" rx="1.5" class="sl-3" fill="#ef4444"/>
    <rect x="252" y="0" width="16" height="7" rx="1.5" class="sl-4" fill="#38bdf8"/>
    <rect x="272" y="0" width="16" height="7" rx="1.5" class="sl-4" fill="#38bdf8"/>
    <rect x="292" y="0" width="16" height="7" rx="1.5" class="sl-4" fill="#38bdf8"/>
    <rect x="312" y="0" width="16" height="7" rx="1.5" class="sl-4" fill="#38bdf8"/>
  </g>

  <!-- ================= LEFT POD: PEDALS & G-FORCE ================= -->
  <g class="font-mono" transform="translate(28, 68)">
    <text x="0" y="10" font-size="10.5" font-weight="700" fill="#8b949e" letter-spacing="1">PEDAL INPUTS &amp; G-FORCE</text>

    <!-- Throttle -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="28" height="92" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <rect x="2" y="18" width="24" height="72" rx="2" fill="#10b981" class="pedal-t"/>
      <text x="4" y="108" font-size="10" font-weight="700" fill="#10b981">THR</text>
    </g>

    <!-- Brake -->
    <g transform="translate(38, 18)">
      <rect x="0" y="0" width="28" height="92" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <rect x="2" y="70" width="24" height="20" rx="2" fill="#ef4444" class="pedal-b"/>
      <text x="4" y="108" font-size="10" font-weight="700" fill="#ef4444">BRK</text>
    </g>

    <!-- Friction Circle -->
    <g transform="translate(85, 18)">
      <rect x="0" y="0" width="90" height="92" rx="6" fill="#11141b" stroke="#21262d" stroke-width="1"/>
      <circle cx="45" cy="46" r="34" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="45" cy="46" r="17" fill="none" stroke="#21262d" stroke-width="1"/>
      <line x1="45" y1="8" x2="45" y2="84" stroke="#21262d" stroke-width="1"/>
      <line x1="8" y1="46" x2="82" y2="46" stroke="#21262d" stroke-width="1"/>
      <circle cx="45" cy="46" r="5" fill="#38bdf8" class="g-dot"/>
      <text x="4" y="108" font-size="9.5" font-weight="600" fill="#8b949e">3.8G LAT · 2.4G LON</text>
    </g>
  </g>

  <!-- ================= CENTER CLUSTER: GEAR, SPEED, RPM ================= -->
  <g class="font-mono" transform="translate(235, 68)">
    <rect x="0" y="0" width="375" height="136" rx="8" fill="#11141b" stroke="#21262d" stroke-width="1.2"/>

    <!-- Current Gear -->
    <g transform="translate(20, 16)">
      <text x="0" y="12" font-size="10.5" font-weight="700" fill="#8b949e" letter-spacing="1">CURRENT GEAR</text>
      <text x="8" y="92" font-size="84" font-weight="900" fill="#ffffff" letter-spacing="-2">6</text>
    </g>

    <line x1="125" y1="16" x2="125" y2="120" stroke="#21262d" stroke-width="1"/>

    <!-- Speed and RPM -->
    <g transform="translate(145, 16)">
      <text x="0" y="12" font-size="10.5" font-weight="700" fill="#8b949e" letter-spacing="1">VELOCITY &amp; RPM</text>
      <text x="0" y="52" font-size="44" font-weight="900" fill="#ffffff">284 <tspan font-size="16" font-weight="600" fill="#8b949e">KM/H</tspan></text>
      <text x="0" y="78" font-size="17" font-weight="700" fill="#f0f6fc">11,840 <tspan font-size="11" fill="#8b949e">RPM</tspan></text>

      <!-- Tacho Bar -->
      <rect x="0" y="86" width="205" height="6" rx="2" fill="#21262d"/>
      <rect x="0" y="86" width="176" height="6" rx="2" fill="url(#tacho-grad)"/>

      <!-- Lap Delta -->
      <text x="0" y="110" font-size="11" fill="#8b949e">LAP DELTA: <tspan fill="#c084fc" font-weight="700">-0.248s</tspan> <tspan fill="#a855f7" font-weight="700">[S2 PURPLE]</tspan></text>
    </g>
  </g>

  <!-- ================= RIGHT POD: TIRE THERMALS ================= -->
  <g class="font-mono" transform="translate(635, 68)">
    <text x="0" y="10" font-size="10.5" font-weight="700" fill="#8b949e" letter-spacing="1">TIRE THERMAL MATRIX (°C)</text>

    <g transform="translate(0, 18)">
      <!-- FL -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="48" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#ef4444">FL // 106°C</text>
        <text x="10" y="34" font-size="10" fill="#8b949e">WEAR: <tspan fill="#ef4444" font-weight="700">76%</tspan></text>
        <rect x="10" y="38" width="90" height="3" rx="1.5" fill="#21262d"/>
        <rect x="10" y="38" width="68" height="3" rx="1.5" fill="#ef4444"/>
      </g>

      <!-- FR -->
      <g transform="translate(125, 0)">
        <rect x="0" y="0" width="110" height="48" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#f59e0b">FR // 101°C</text>
        <text x="10" y="34" font-size="10" fill="#8b949e">WEAR: <tspan fill="#f59e0b" font-weight="700">62%</tspan></text>
        <rect x="10" y="38" width="90" height="3" rx="1.5" fill="#21262d"/>
        <rect x="10" y="38" width="56" height="3" rx="1.5" fill="#f59e0b"/>
      </g>

      <!-- RL -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="110" height="48" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#10b981">RL // 98°C</text>
        <text x="10" y="34" font-size="10" fill="#8b949e">WEAR: <tspan fill="#10b981" font-weight="700">45%</tspan></text>
        <rect x="10" y="38" width="90" height="3" rx="1.5" fill="#21262d"/>
        <rect x="10" y="38" width="40" height="3" rx="1.5" fill="#10b981"/>
      </g>

      <!-- RR -->
      <g transform="translate(125, 56)">
        <rect x="0" y="0" width="110" height="48" rx="4" fill="#11141b" stroke="#21262d" stroke-width="1"/>
        <text x="10" y="18" font-size="11" font-weight="700" fill="#10b981">RR // 99°C</text>
        <text x="10" y="34" font-size="10" fill="#8b949e">WEAR: <tspan fill="#10b981" font-weight="700">48%</tspan></text>
        <rect x="10" y="38" width="90" height="3" rx="1.5" fill="#21262d"/>
        <rect x="10" y="38" width="43" height="3" rx="1.5" fill="#10b981"/>
      </g>
    </g>
  </g>

  <!-- ================= RADIO CALLOUT BAR (HIGH LEGIBILITY) ================= -->
  <g class="font-mono" transform="translate(24, 222)">
    <rect x="0" y="0" width="852" height="58" rx="6" fill="#11141b" stroke="#21262d" stroke-width="1"/>

    <!-- Radio Indicator -->
    <g transform="translate(16, 12)">
      <circle cx="8" cy="8" r="4" fill="#ef4444" class="live-pulse"/>
      <text x="20" y="12" font-size="10" font-weight="700" fill="#f87171" letter-spacing="1">PIT-TO-CAR RADIO // GROQ AI VOICE &lt;150ms</text>
    </g>

    <!-- Subtitle (Clear, Readable Font) -->
    <text x="36" y="44" font-size="11.5" font-weight="600" fill="#f0f6fc">
      CREW CHIEF AI: <tspan fill="#52e3a1">"Box this lap for Mediums. FL thermal 106°C (76% wear) — cliff imminent."</tspan>
    </text>

    <!-- Specs -->
    <g transform="translate(730, 14)">
      <text x="0" y="11" font-size="10" fill="#8b949e">LATENCY: <tspan fill="#38bdf8" font-weight="700">128ms</tspan></text>
      <text x="0" y="27" font-size="10" fill="#8b949e">PACKET DROP: <tspan fill="#10b981" font-weight="700">0.00%</tspan></text>
    </g>
  </g>
</svg>
