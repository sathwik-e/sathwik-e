<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 22" width="100%" height="22">
  <defs>
    <linearGradient id="stripe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="85%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>

    <pattern id="checkers" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#1e293b" fill-opacity="0.6"/>
      <rect x="6" y="6" width="6" height="6" fill="#1e293b" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    @keyframes sweep {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -160; }
    }
    .sweep-line {
      stroke-dasharray: 16 8;
      animation: sweep 4s linear infinite;
    }
    ]]>
  </style>

  <!-- Background Chequered Pattern subtle strip -->
  <rect x="100" y="7" width="700" height="8" fill="url(#checkers)"/>

  <!-- Subtle Underlying Rail -->
  <line x1="20" y1="11" x2="880" y2="11" stroke="#161e27" stroke-width="1"/>

  <!-- Animated Racing Telemetry Sweep -->
  <line x1="80" y1="11" x2="820" y2="11" stroke="url(#stripe-grad)" stroke-width="2" class="sweep-line"/>

  <!-- Left Speed Tick -->
  <polygon points="76,6 84,11 76,16" fill="#22c55e"/>

  <!-- Center Diamond Nodes -->
  <rect x="445" y="6" width="10" height="10" fill="#07090e" stroke="#38bdf8" stroke-width="1.5" transform="rotate(45 450 11)"/>
  <circle cx="450" cy="11" r="2" fill="#4ade80"/>

  <!-- Right Speed Tick -->
  <polygon points="824,6 816,11 824,16" fill="#38bdf8"/>
</svg>
