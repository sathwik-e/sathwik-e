<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 210" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040609"/>
      <stop offset="50%" stop-color="#070b13"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <linearGradient id="card-border-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52e3a1" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#52e3a1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wave-mask-01" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="cmask-01">
      <rect x="0" y="0" width="430" height="210" fill="url(#wave-mask-01)"/>
    </mask>
  </defs>

  <style>
    <![CDATA[
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }

    @keyframes card-wave {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(-200px, 0px); }
    }

    .card-waves {
      animation: card-wave 8.5s linear infinite;
      transition: opacity 0.3s ease;
    }

    svg:hover .card-waves {
      animation-duration: 3.0s;
      opacity: 0.65;
      filter: drop-shadow(0 0 3px #52e3a1);
    }

    .card-shell {
      transition: all 0.3s ease;
    }
    svg:hover .card-shell {
      stroke: #52e3a1;
      stroke-width: 1.5;
    }
    svg:hover .cta-link {
      fill: #ffffff;
      filter: drop-shadow(0 0 5px #52e3a1);
    }
    ]]>
  </style>

  <!-- Background Shell & Tech Border -->
  <rect class="card-shell" x="1" y="1" width="428" height="208" rx="10" ry="10" fill="url(#card-bg)" stroke="url(#card-border-01)" stroke-width="1.2"/>

