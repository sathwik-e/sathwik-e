    <text x="0" y="0" class="font-sans" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.4">🏎️ Pitwall Telemetry Engine</text>
    
    <text x="0" y="24" class="font-sans" font-size="12" font-weight="400" fill="#94a3b8" line-height="1.45">
